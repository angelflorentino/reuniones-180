site_name: Reuniones 180
site_description: Notas y planificación de Reuniones 180
site_url: https://angelflorentino.github.io/reuniones-180/
repo_url: https://github.com/angelflorentino/reuniones-180
repo_name: GitHub
site_author: angelflorentino

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Planificación Jóvenes 2026-10-09: planificacion-jovenes-2026-10-09.md
